name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Package Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Timenotifier.Tests\Timenotifier.Tests.csproj

      - name: Test
        run: dotnet test Timenotifier.Tests\Timenotifier.Tests.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Timenotifier.csproj --configuration Release --no-restore --runtime win-x64 --self-contained false --output artifacts\Timenotifier

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path artifacts\Timenotifier\* -DestinationPath "artifacts\Timenotifier-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/Timenotifier-${{ github.ref_name }}-win-x64.zip
